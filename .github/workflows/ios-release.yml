name: iOS release

# Start a run either from the Actions tab, or by pushing to one of these branches:
#   release/testflight  -> TestFlight upload
#   release/appstore    -> App Store upload (listing + screenshots), no review submission
#   release/submit      -> App Store upload and submit for App Review
on:
  push:
    branches: ["release/testflight", "release/appstore", "release/submit"]
  workflow_dispatch:
    inputs:
      lane:
        description: "beta = TestFlight only / release = App Store (listing + screenshots)"
        type: choice
        options: [beta, release]
        default: beta
      submit:
        description: "Submit for App Review (release lane only)"
        type: boolean
        default: false

env:
  LANE: ${{ github.event_name == 'push' && (github.ref_name == 'release/testflight' && 'beta' || 'release') || inputs.lane }}
  SUBMIT: ${{ github.event_name == 'push' && github.ref_name == 'release/submit' || inputs.submit == true }}

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          # Prints only facts about the key, never the key itself.
          if [ "$ASC_KEY_ID" = "5GBDQQ6X69" ]; then
            echo "::error::ASC_KEY_ID is still the old App Manager key (5GBDQQ6X69). Register the Admin key."
            exit 1
          fi
          echo "ASC_KEY_ID length: ${#ASC_KEY_ID}, first two chars: ${ASC_KEY_ID:0:1} ${ASC_KEY_ID:1:1}"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/check.p8"
          if openssl pkey -in "$RUNNER_TEMP/check.p8" -noout 2>/dev/null; then echo "p8 key: valid private key"; else echo "::error::ASC_KEY_P8_BASE64 is not a valid .p8 key"; exit 1; fi
          rm -f "$RUNNER_TEMP/check.p8"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable

      - name: Show Xcode version
        run: xcodebuild -version

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build Flutter iOS (unsigned)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Fastlane ${{ env.LANE }}
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REVIEW_FIRST_NAME: ${{ secrets.REVIEW_FIRST_NAME }}
          REVIEW_LAST_NAME: ${{ secrets.REVIEW_LAST_NAME }}
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
        run: bundle exec fastlane "$LANE"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore

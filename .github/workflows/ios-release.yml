name: iOS release

# Start a run either from the Actions tab, or by pushing a tag:
#   testflight-<anything>  -> TestFlight upload
#   appstore-<anything>    -> App Store upload (listing + screenshots), no review submission
#   submit-<anything>      -> App Store upload and submit for App Review
on:
  push:
    tags: ["testflight-*", "appstore-*", "submit-*"]
  workflow_dispatch:
    inputs:
      lane:
        description: "beta = TestFlight only / release = App Store (listing + screenshots)"
        type: choice
        options: [beta, release]
        default: beta
      submit:
        description: "Submit for App Review (release lane only)"
        type: boolean
        default: false

env:
  LANE: ${{ github.event_name == 'push' && (startsWith(github.ref_name, 'testflight-') && 'beta' || 'release') || inputs.lane }}
  SUBMIT: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'submit-') || inputs.submit == true }}

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build Flutter iOS (unsigned)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Fastlane ${{ env.LANE }}
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane "$LANE"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
